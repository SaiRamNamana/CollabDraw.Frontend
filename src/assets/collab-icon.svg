<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <radialGradient id="ambient" cx="20%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e1b4b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="512" height="512" rx="124" fill="url(#bg)" />
  <rect width="512" height="512" rx="124" fill="url(#ambient)" />
  <rect x="6" y="6" width="500" height="500" rx="118" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="8" />

  <!-- CollabDraw CD Drawing Motif -->
  <g filter="url(#glow)">
    <!-- C stroke -->
    <path d="M 218 160 A 96 96 0 1 0 218 352"
          fill="none"
          stroke="#ffffff"
          stroke-width="50"
          stroke-linecap="round" />

    <!-- D stroke -->
    <path d="M 284 160 H 318 A 96 96 0 0 1 318 352 H 284 Z"
          fill="none"
          stroke="#ffffff"
          stroke-width="50"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>

  <!-- Live Collaboration Pulse / Cursor Spark -->
  <circle cx="396" cy="144" r="26" fill="#38bdf8" stroke="#ffffff" stroke-width="8" />
</svg>